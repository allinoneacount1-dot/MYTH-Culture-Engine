name: MythScene
camera:
  keyframes:
    - { at: 0, pos: [0, 1.5, 10], target: [0, 0, 0] }
    - { at: 0.17, pos: [4, 1.5, 14], target: [-1, 0, -1] }
    - { at: 0.33, pos: [0, 0.8, 9], target: [0, 0.3, 0] }
    - { at: 0.5, pos: [-5, 2.5, 13], target: [0, 0, 0] }
    - { at: 0.67, pos: [0, 7, 16], target: [0, -1, 0] }
    - { at: 0.83, pos: [0, 1, 6], target: [0, 0.5, 0] }
    - { at: 1, pos: [0, 0.2, 3.5], target: [0, 0, 0] }
fog: { color: "#05070B", density: 0.015, type: exp2 }
bloom: { intensity: 0.5, threshold: 0.1, mipmapBlur: true }
objects:
  - type: torusKnot
    args: [1.2, 0.4, 180, 24]
    position: [0, 0.5, -3]
    material: { color: "#D8B36A", metalness: 0.85, roughness: 0.08, emissive: "#D8B36A" }
    animation: { rotateY: 0.12, rotateX: 0.08, float: true }
    visibility: { center: 0.3, width: 0.8 }
  - type: sphere
    args: [0.55, 48, 48]
    position: [0, 0, 0]
    material: { color: "#D8B36A", metalness: 0.9, roughness: 0.05, emissive: "#D8B36A" }
    glow: { color: "#D8B36A", intensity: 0.8, scale: 1.15 }
    animation: { rotateY: 0.04, breathe: true }
    visibility: { center: 2.5, width: 1 }
  - type: particleRing
    radius: 1.8
    count: 100
    color: "#3AE9E0"
    speed: 0.15
    spread: 0.2
  - type: particleRing
    radius: 2.8
    count: 120
    color: "#D8B36A"
    speed: -0.1
    spread: 0.3
  - type: relic
    args: [0.45, 2]
    position: [0, 0.3, 0]
    solid: { material: { color: "#D8B36A", metalness: 0.9, roughness: 0.05, emissive: "#D8B36A" } }
    wireframe: { material: { color: "#3AE9E0" }, opacity: 0.25, scale: 1.5 }
    glow: { color: "#D8B36A", intensity: 1.2, scale: 1.3 }
    animation: { rotateY: 0.18, breathe: true }
    visibility: { center: 4.5, width: 1.5 }
  - type: glyphs
    count: 6
    orbit: { radius: [1.6, 3.1], speed: 0.12 }
    colors: ["#D8B36A", "#3AE9E0", "#A33A4A"]
    visibility: { center: 4.8, width: 1.8 }
  - type: towers
    area: { x: [-4, 4, 0.7], z: [-3, 3, 0.7] }
    density: 0.5
    height: [0.2, 1.0]
    colors: ["#10213A", "#F7F4EE", "#D8B36A"]
    visibility: { center: 3.8, width: 1.2 }
  - type: galaxy
    count: 5000
    arms: 3
    size: 0.022
    visibility: { center: 5.5, width: 1 }
  - type: lightShaft
    count: 3
    colors: ["#D8B36A", "#3AE9E0", "#A33A4A"]
  - type: dust
    count: 800
    size: 0.012
    visibility: { center: 3, width: 2 }
